<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <!-- CABECERA -->
    <header>
        <nav style="display: flex; justify-content: space-between;">
            <svg xmlns="http://w3.org" viewBox="0 0 100 100" width="75" height="75">
                <!-- Cuerpo principal del grano de café -->
                <ellipse cx="50" cy="50" rx="35" ry="25" fill="#6F4E37" transform="rotate(-25 50 50)" />
                <!-- Línea o corte central con efecto de profundidad -->
                <path d="M 32 38 Q 50 55 68 62" stroke="#4A3319" stroke-width="4" fill="none" stroke-linecap="round" />
            </svg>

            <ul style="display: flex; list-style: none; ">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="galeria.html">&nbsp; Galeria</a></li>
                <li><a href="ubicacion.html">&nbsp; Ubicados</a></li>
                <li><a href="BuscaEmpleo.html">&nbsp; Solicitud de Empleo</a></li>
            </ul>
        </nav>
    </header>

    <main id="contenido">
        <article>
            <h1>Conocenos</h1>

            <h2>video local</h2>
            <video controls>
                <source src="resources/videos/cafeteria.mp4" type="video/mp4">
                <source src="resources/videos/cafeteria.webm" type="video/webm">
                <p>Tu navegador no soporta el elemneto de audio</p>
                <a href="resources/videos/cafeteria.mp4">Descargar el archivo</a>
            </video>
        </article>

        <article>
            <h2>Imagenes</h2>

            <div style="display: flex;">
                <figure>
                    <picture>
                        <source srcset="resources/img/local.png" type="image/png">
                        <source srcset="resources/img/local.webp" type="image/webp">
                        <img srcset="resources/img/local.png" alt="mesas y sillas y facilidades del local" height="300">
                    </picture>
                    <figcaption style="font-size: 30px;">Local</figcaption>
                </figure>
                    
                <figure>
                    <picture>
                        <source srcset="resources/img/menu.png" type="image/png">
                        <source srcset="resources/img/menu.webp" type="image/webp">
                        <img srcset="resources/img/menu.png" alt="Hoja con el menu del local" height="300">
                    </picture>
                    <figcaption style="font-size: 30px;">Menu</figcaption>
                </figure>
                
                <figure>
                    <picture>
                        <source srcset="resources/img/vitrina.png" type="image/png">
                        <source srcset="resources/img/vitrina.webp" type="image/webp">
                        <img srcset="resources/img/vitrina.png" alt="Camara de fio y de calor con productos de reposteria" height="300">
                    </picture>
                    <figcaption style="font-size: 30px;">Productos</figcaption>
                </figure>
                    
            </div>
        </article>

    <footer>
        <h2>Contacto</h2>
        <address>
            Cafeteria CafeTico<br>

        </address>
        
        <p><small>&copy; 2026 &middot; CafeTico &middot; Todos los derechos reservados</small></p>
